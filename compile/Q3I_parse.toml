[parse]
net_name = 'Q3I'
framework = 'onnx'
network = './fmodel/q3i_v1/model.onnx'
network_exdata  = './fmodel/q3i_v1/model.onnx.data'
jr_path = './jr_path/Q3I/' 
max_prompt_length = 32
max_tokens_length = 512
target = 'zhuge'
llm_mode = true
quantized = true

[optimize]
target = 'zhuge'
json = './jr_path/Q3I//Q3I-decoder_parsed.json'
raw = './jr_path/Q3I//Q3I-decoder_parsed.raw'
jr_path = './jr_path/Q3I/'  

[quantize]
json = './jr_path/Q3I//Q3I-decoder_optimized.json'
raw = './jr_path/Q3I//Q3I-decoder_optimized.raw'
jr_path = './jr_path/Q3I/' 
qdtype = "fp16"
target = "zhuge"

[adapt]
target = 'zhuge'
json = './jr_path/Q3I//Q3I-decoder_quantized.json'
raw = './jr_path/Q3I//Q3I-decoder_quantized.raw'
jr_path = './jr_path/Q3I/'
pass_off = "icraft.MergeTransDataOpSeqPass"

[generate]
json = './jr_path/Q3I//Q3I-decoder_adapted.json'
raw = './jr_path/Q3I//Q3I-decoder_adapted.raw'
jr_path = './jr_path/Q3I/' 
